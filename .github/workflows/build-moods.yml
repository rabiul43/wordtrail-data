name: Build moods and similar books

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: write

concurrency:
  group: build-moods
  cancel-in-progress: false

jobs:
  moods:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag moods and find similar books
        run: python build_moods.py --limit 1500

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moods.json similar.json moods_cache.json.gz
          git diff --cached --quiet || git commit -m "Update moods and similar books"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
