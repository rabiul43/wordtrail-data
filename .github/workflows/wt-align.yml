name: Wordtrail alignment check
on:
  schedule: [{ cron: "15 3 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python wt_align.py
        env:
          WT_PAT: ${{ secrets.WT_PAT }}
      - run: |
          git config user.name "wt-align-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A align.json data
          git diff --cached --quiet || (git commit -m "Alignment check" && git pull --rebase && git push)
      - run: python wt_align.py --issues
        env:
          REPO: ${{ github.repository }}
          WT_PAT: ${{ secrets.WT_PAT }}
