name: Wordtrail cuts

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - wt_cuts.py

permissions:
  contents: write

jobs:
  cuts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find intro and outro cuts
        run: python wt_cuts.py
      - name: Save cuts.json
        run: |
          git config user.name "wordtrail-bot"
          git config user.email "wordtrail-bot@users.noreply.github.com"
          git add cuts.json
          git diff --cached --quiet || (git commit -m "update cuts.json" && git pull --rebase && git push)
