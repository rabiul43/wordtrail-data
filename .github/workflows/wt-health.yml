name: Wordtrail health
on:
  schedule: [{ cron: "30 5 * * *" }]
  workflow_dispatch:
  push:
    paths: [wt_health.py, maintenance.json]
permissions: { contents: write, actions: write }
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python wt_health.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
      - run: |
          git config user.name "wt-health-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A health.json data
          git diff --cached --quiet || (git commit -m "Update health" && git pull --rebase && git push)
