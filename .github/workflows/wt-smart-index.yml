name: Wordtrail smart index
on:
  schedule: [{ cron: "0 5 * * *" }]
  workflow_dispatch:
  push:
    paths: [wt_smart_index.py]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python wt_smart_index.py
      - run: |
          git config user.name "wt-index-bot"; git config user.email "bot@users.noreply.github.com"
          git add search.json versions.json gutenberg_stats.json
          git diff --cached --quiet || (git commit -m "Update smart index" && git pull --rebase && git push)
