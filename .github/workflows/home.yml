name: Refresh home
on:
  schedule: [{cron: '20 2 * * *'}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_home.py
      - run: |
          git config user.name "catalog-bot"; git config user.email "bot@users.noreply.github.com"
          git add home.json; git commit -m "Refresh home" || exit 0
          git pull --rebase; git push
